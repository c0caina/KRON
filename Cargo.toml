[package]
name = "kron"
version = "0.3.0"
edition = "2024"
description = "Minimal model and root console harness"

[dependencies]
anyhow = "1"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "io-util"] }

tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
