<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>kron minimal</title>
<form><textarea aria-label="Сообщение" required></textarea><button>↑</button></form><pre style="white-space:pre-wrap;overflow-wrap:anywhere" aria-live="polite"></pre>
<script>
const form=document.querySelector('form'),input=form.querySelector('textarea'),button=form.querySelector('button'),answer=document.querySelector('pre');
form.onsubmit=async e=>{e.preventDefault();button.disabled=true;answer.textContent='…';try{const r=await fetch('/message',{method:'POST',headers:{'Content-Type':'application/json','X-Kron':'1'},body:JSON.stringify({text:input.value})});if(!r.ok)throw Error(await r.text());answer.textContent=(await r.json()).text;}catch(e){answer.textContent=e.message;}finally{button.disabled=false;}};
</script>
