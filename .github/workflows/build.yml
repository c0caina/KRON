name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, test: true }
          - { os: ubuntu-latest, target: aarch64-linux-android, test: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Android NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Test
        if: matrix.test
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Model and console smoke test
        if: matrix.test
        env:
          KRON_BIN: target/${{ matrix.target }}/release/kron
        run: |
          python3 tests/smoke.py
          python3 tests/launcher.py

      - uses: actions/cache@v4
        if: matrix.target == 'aarch64-linux-android'
        id: ignition
        with:
          path: ignition-files
          key: ignition-lfm2.5-2.6b-q4km-b11500-v1

      - name: Prepare ignition model
        if: matrix.target == 'aarch64-linux-android' && steps.ignition.outputs.cache-hit != 'true'
        run: bash android/ignition.sh ignition-files

      - name: Android app
        if: matrix.target == 'aarch64-linux-android'
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}-${{ github.run_number }}
        run: |
          (yes 2>/dev/null || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          android/build.sh target/${{ matrix.target }}/release/kron target/${{ matrix.target }}/release/kron.apk ignition-files

      - name: Package editable runtime
        shell: bash
        run: |
          tar -czf target/${{ matrix.target }}/release/kron-runtime.tar.gz \
            -C target/${{ matrix.target }}/release kron -C "$GITHUB_WORKSPACE" runtime

      - uses: actions/upload-artifact@v4
        with:
          name: kron-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/kron
            target/${{ matrix.target }}/release/kron-runtime.tar.gz
            target/${{ matrix.target }}/release/kron.apk
          if-no-files-found: error
          compression-level: 0

  # Direct APK link for this branch (no zip, no GitHub login):
  # https://github.com/<owner>/<repo>/releases/download/minimal/kron-minimal.apk
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/minimal-root-harness'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-minimal
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish the "minimal" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir out
          cp kron-aarch64-linux-android/kron.apk out/kron-minimal.apk
          cp kron-aarch64-linux-android/kron out/kron-android-arm64
          cp kron-x86_64-unknown-linux-gnu/kron-runtime.tar.gz out/kron-linux-x64.tar.gz
          cp kron-aarch64-linux-android/kron-runtime.tar.gz out/kron-android-arm64.tar.gz
          gh release delete minimal --yes --cleanup-tag || true
          gh release create minimal out/* --prerelease --target "$GITHUB_SHA" \
            --title "minimal (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Сборка из ${GITHUB_REF_NAME}. Телефон: скачайте и установите kron-minimal.apk. Включает локальную LFM2.5 2.6B Q4_K_M, около 1.8 ГБ; root обязателен."
